site_name: The Digital Ruins
site_url: https://thedigitalruins.com
site_author: Marjean Mayo-Baker

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marjeanm
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/YourLinkedInUsername
    - icon: fontawesome/brands/blogger
      link: https://blog.thedigitalruins.com

extra_css:
  - stylesheets/digital-ruins.css

nav:
  - Home: index.md
  - About: about.md
  - Portfolio:
      - Portfolio Overview: portfolio/index.md
      - Enterprise Risk Register: portfolio/enterprise-risk-register.md
      - Cybersecurity Audit & Assessment Playbook: portfolio/cybersecurity-audit-assessment-playbook.md
      - Access Governance Assessment: portfolio/access-governance-assessment.md
      - Compliance Assessment: portfolio/compliance-assessment.md
  - Governance SIMs: governance/index.md
  - Playbooks:
      - Playbook Overview: playbooks/index.md
      - Audit Log Playbook: playbooks/audit-log-playbook.md
  - Blog: Blog/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
