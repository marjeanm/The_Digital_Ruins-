site_name: Digital Ruins SIM Portfolio
site_url: https://thedigitalruins.com
site_author: Marjean Mayo-Baker

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marjeanm
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/YourLinkedInUsername
    - icon: fontawesome/brands/blogger
      link: https://blog.thedigitalruins.com

nav:
  - Home: index.md
  - About: about.md

  - Governance SIMs:
      - MFA Ghost:
          - Overview: governance/SIMs/MFA_Ghost/README.md
          - SIM Project: governance/SIMs/MFA_Ghost/SIM_Project.md
          - Executive Risk Brief: governance/SIMs/MFA_Ghost/Executive_Risk_Brief.md
          - Lessons Learned: governance/SIMs/MFA_Ghost/Lessons_Learned.md
          - Timeline: governance/SIMs/MFA_Ghost/Timeline.md

      - Shiny Trust Breach:
          - Overview: governance/SIMs/Shiny_Trust_Breach/README.md
          - Executive Brief: governance/SIMs/Shiny_Trust_Breach/Executive_Brief.md
          - Lessons Learned: governance/SIMs/Shiny_Trust_Breach/Lessons_Learned.md
          - Timeline: governance/SIMs/Shiny_Trust_Breach/Timeline.md
          - AI Risk Clause: governance/SIMs/Shiny_Trust_Breach/AI_Risk_Clause.md
          - Contractor Onboarding SOP: governance/SIMs/Shiny_Trust_Breach/Contractor_Onboarding_SOP.md

      - Trust Betrayal:
          - Overview: governance/SIMs/Trust_Betrayal/README.md
          - Executive Brief: governance/SIMs/Trust_Betrayal/Executive_Brief.md
          - Lessons Learned: governance/SIMs/Trust_Betrayal/Lessons_Learned.md
          - Timeline: governance/SIMs/Trust_Betrayal/Timeline.md

      - Human Failure Vector:
          - Overview: governance/SIMs/Human_Failure_Vector/README.md

  - MFA:
      - Conditional Access Policy: mfa/conditional-access-policy.md
      - MFA Reference Pack: mfa/mfa-reference-pack.md

  - Playbooks:
      - Audit Log Playbook: playbooks/audit-log-playbook.md

  - CVE Tracking:
      - Overview: cve-tracking/index.md
      - Dependencies: cve-tracking/dependencies.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
