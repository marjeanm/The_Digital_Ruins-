site_name: Digital Ruins SIM Portfolio
site_url: https://thedigitalruins.com
site_author: Marjean Mayo-Baker

theme:
  name: material
  language: en
  palette:
    - scheme: slate  # dark mode by default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default  # light mode as optional
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YourGitHubUsername
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/YourLinkedInUsername
    - icon: fontawesome/brands/blogger
      link: https://yourbloggerurl.com


nav:
  - Home: index.md
  - About: about.md

  - Projects:
      - Google / Salesforce Breach:
          - Overview: governance/SIMs/Shiny_Trust_Breach/README.md
          - Executive Brief: governance/SIMs/Shiny_Trust_Breach/Executive_Brief.md
          - Timeline: governance/SIMs/Shiny_Trust_Breach/Timeline.md
          - Lessons Learned: governance/SIMs/Shiny_Trust_Breach/Lessons_Learned.md
          - AI Risk Clause: governance/SIMs/Shiny_Trust_Breach/AI_Risk_Clause.md
          - Contractor Onboarding SOP: governance/SIMs/Shiny_Trust_Breach/Contractor_Onboarding_SOP.md

      - SOC Escalation (Trust Betrayal):
          - Overview: governance/SIMs/Trust_Betrayal/README.md
          - Executive Brief: governance/SIMs/Trust_Betrayal/Executive_Brief.md
          - Timeline: governance/SIMs/Trust_Betrayal/Timeline.md
          - Lessons Learned: governance/SIMs/Trust_Betrayal/Lessons_Learned.md
          - Governance Policy: governance/SIMs/Trust_Betrayal/Governance_Policy.md

      - Contractor Risk (Human Failure Vector):
          - Overview: governance/SIMs/Human_Failure_Vector/README.md
          - Executive Brief: governance/SIMs/Human_Failure_Vector/Executive_Brief.md
          - Timeline: governance/SIMs/Human_Failure_Vector/Timeline.md
          - Lessons Learned: governance/SIMs/Human_Failure_Vector/Lessons_Learned.md

      - MFA IAM Failure (MFA Ghost):
