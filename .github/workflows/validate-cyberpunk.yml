name: Validate Cyberpunk Portfolio

on:
  pull_request:
    paths:
      - 'docs/cyberpunk/**'
      - 'docs/stylesheets/cyberpunk.css'
      - 'mkdocs.yml'
      - '.github/workflows/validate-cyberpunk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mkdocs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: python -m pip install mkdocs-material
      - name: Build documentation without deployment
        run: mkdocs build --verbose
      - name: Assert both interfaces were built
        run: |
          test -f site/index.html
          test -f site/portfolio/index.html
          test -f site/cyberpunk/index.html
          test -f site/cyberpunk/projects/index.html
          test -f site/stylesheets/cyberpunk.css
          test -f site/stylesheets/digital-ruins.css
